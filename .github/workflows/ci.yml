name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        qiskit-version: ["2.5.1", "2.5.2", "2.6.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install "qiskit==${{ matrix.qiskit-version }}"

      - name: Test
        run: pytest tests/ -v --tb=short --cov=autoq_qec --cov-report=term-missing --cov-fail-under=80

      - name: Lint (ruff)
        run: ruff check autoq_qec/ tests/

      - name: Type-check (mypy)
        run: mypy autoq_qec/
