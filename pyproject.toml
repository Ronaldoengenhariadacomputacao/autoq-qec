[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoq-qec"
version = "3.4.7"
description = "Multi-code QEC resource estimator for arbitrary Qiskit circuits"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ronaldo Rodrigues", email = "Ronaldoengenhariadacomputacao@hotmail.com"}
]
keywords = ["quantum", "qec", "surface-code", "fault-tolerant", "qiskit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0,<3",
    "numpy>=1.24",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.20"]
sim = ["qiskit-aer>=0.14"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-cov", "matplotlib>=3.7", "qiskit-ibm-runtime>=0.20", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/Ronaldoengenhariadacomputacao/autoq-qec"
Issues = "https://github.com/Ronaldoengenhariadacomputacao/autoq-qec/issues"
ORCID = "https://orcid.org/0009-0006-7449-1190"

[tool.setuptools.packages.find]
include = ["autoq_qec*"]

[tool.setuptools.package-data]
autoq_qec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E701/E702: this codebase deliberately uses one-line `a; b` statements in
# tests for compact circuit construction -- a style choice, not a bug.
# UP045: Optional[X] (not X | None) is the style already used throughout
# the codebase, including in dataclass field annotations -- not switching.
ignore = ["E701", "E702", "UP045"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["autoq_qec"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
